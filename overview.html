<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enza — Design overview</title><link rel="stylesheet" href="styles.css"><style>body{background:#eeede9}.board{max-width:1360px;margin:auto;padding:48px 70px 35px}.board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:33px}.board-head h1{font-size:32px;line-height:1.6;letter-spacing:-1px}.board-head h1 span{color:#df2635}.board-head p{font-size:12px;color:#777980;margin-top:7px}.board-head .wordmark{margin:0}.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px}.board-grid figure{margin:0;min-width:0}.board-grid img{width:100%;display:block;border:6px solid #27282c;border-radius:35px;box-shadow:0 14px 24px #25262b16}.board-grid figcaption{font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin:17px 3px 0}.board-grid figcaption span{font:500 10px 'DM Sans',sans-serif;color:#8d8e89;letter-spacing:1px}.board-footer{display:flex;justify-content:space-between;color:#868781;font-size:10px;margin-top:32px;border-top:1px solid #d8d7cf;padding-top:16px}@media(max-width:700px){.board{padding:25px 20px}.board-head .wordmark{display:none}.board-head h1{font-size:25px}.board-grid{gap:12px}.board-grid img{border-width:3px;border-radius:15px}.board-grid figcaption{font-size:10px}.board-grid figcaption span{display:none}}</style></head><body><div class="board"><header class="board-head"><div><h1>كل تفاصيل شغلك. <span>في إيدك.</span></h1><p>Enza Trade — تجربة أندرويد عربية لإدارة الطلبات والمخزن والعملاء</p></div><div class="wordmark"><span class="brand-mark">E</span><span>ENZA<small>TRADE / OPERATIONS</small></span></div></header><main class="board-grid"><figure><img src="previews/01-home.jpg" alt="الرئيسية — ملخص اليوم والطلبات"><figcaption>نظرة على يومك <span>OVERVIEW</span></figcaption></figure><figure><img src="previews/04-inventory.jpg" alt="المخزن — المنتجات والأرصدة"><figcaption>المخزن في إيدك <span>INVENTORY</span></figcaption></figure><figure><img src="previews/07-scanner.jpg" alt="الماسح — الوصول للمنتج بالكود"><figcaption>امسح وكمّل شغلك <span>SCAN & GO</span></figcaption></figure></main><footer class="board-footer"><span>تصميم تفاعلي • بيانات توضيحية</span><span>ENZA MOBILE / UI & UX / 2026</span></footer></div></body></html>
